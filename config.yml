# 監視対象のテニスコート
facility_keywords:
  - "町田中央公園テニスコート"
  - "鶴川中央公園テニスコート"
  - "鶴川第２テニスコート"
  - "野津田公園テニスコート"
  - "野津田公園北テニスコート"

# 今日から何日先までを監視対象にするか
days_ahead: 30

# 希望日時
schedule:
  # 土曜・日曜・祝日は全時間帯
  weekends_and_holidays:
    all_day: true

  # 平日は 19:00-21:00 のみ
  weekdays:
    time_ranges:
      - start: "19:00"
        end: "21:00"

# サイト上で「空き」を示す文字
available_tokens:
  - "○"
  - "空き"
  - "予約可"
